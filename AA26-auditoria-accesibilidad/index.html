<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller de Auditoría de Accesibilidad - Cátedra PLP III</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background-color: #ffffff;
            color: #1f2937;
        }

        /* Regla 2: se borró "*:focus { outline: none !important; }"
           y se marca el foco solo cuando se navega con el teclado */
        :focus-visible {
            outline: 3px solid #c2410c;
            outline-offset: 3px;
        }

        .texto-bajo-contraste {
            color: #4b5563;
            font-size: 0.9rem;
        }

        .btn {
            background-color: #2563eb;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:disabled {
            background-color: #6b7280;
            cursor: not-allowed;
        }

        .btn-icono {
            margin-left: 10px;
            padding: 8px;
            font-size: 1.2rem;
            background-color: #ffffff;
            border: 1px solid #9ca3af;
            border-radius: 5px;
            cursor: pointer;
        }

        .tarjeta {
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="email"] {
            padding: 8px;
            width: 280px;
            border: 1px solid #6b7280;
            border-radius: 5px;
        }

        .mensaje {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Portal de Compras - Ejercicio de Auditoría</h1>
    </header>

    <main>
        <section>
            <h2>Catálogo de Productos Destacados</h2>

            <article class="tarjeta">
                <img src="https://www.ucp.edu.ar/wp-content/themes/ucp23/lib/ucp/img/universidad-cuenca-plata.svg" width="100"
                     alt="Logo de la Universidad de la Cuenca del Plata">

                <h3>Auriculares Inalámbricos</h3>

                <p class="texto-bajo-contraste">Stock disponible: 5 unidades en depósito central.</p>

                <!-- Regla 1: botón real en lugar del div -->
                <button type="button" class="btn" id="btn-agregar">Agregar al Carrito</button>

                <button type="button" class="btn-icono" id="btn-quitar" aria-label="Quitar del carrito">
                    <span aria-hidden="true">🗑️</span>
                </button>

                <!-- Mensajes del carrito, anunciados por el lector de pantalla -->
                <p id="mensaje-carrito" class="mensaje" aria-live="polite" aria-atomic="true"></p>
            </article>
        </section>

        <section class="tarjeta">
            <h2>Suscripción a Novedades</h2>

            <form id="form-suscripcion">
                <div style="margin-bottom: 10px;">
                    <label for="email-user">Correo electrónico</label>
                    <input type="email" id="email-user" placeholder="Ingrese su correo electrónico..." required>
                </div>

                <button type="submit" class="btn" id="btn-enviar">Suscribirme</button>
            </form>

            <!-- Regla 3: región de notificaciones accesible -->
            <div id="resultado-servidor" class="mensaje" aria-live="polite" aria-atomic="true"></div>
        </section>
    </main>

    <footer>
        <p>Cátedra Paradigmas y Lenguajes de Programación III</p>
    </footer>

    <script>
        // Carrito: al ser un <button> funciona con clic, Enter y barra espaciadora
        const btnAgregar = document.getElementById('btn-agregar');
        const btnQuitar = document.getElementById('btn-quitar');
        const mensajeCarrito = document.getElementById('mensaje-carrito');
        let cantidad = 0;

        btnAgregar.addEventListener('click', () => {
            cantidad++;
            mensajeCarrito.textContent = 'Producto agregado. Unidades en el carrito: ' + cantidad;
        });

        btnQuitar.addEventListener('click', () => {
            if (cantidad > 0) {
                cantidad--;
            }
            mensajeCarrito.textContent = 'Producto quitado. Unidades en el carrito: ' + cantidad;
        });

        // Suscripción
        const formulario = document.getElementById('form-suscripcion');
        const btnEnviar = document.getElementById('btn-enviar');
        const respuestaUI = document.getElementById('resultado-servidor');

        formulario.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Regla 3: se deshabilita el botón mientras dura la petición
            btnEnviar.disabled = true;
            btnEnviar.textContent = 'Enviando...';

            // Regla 4: siempre textContent, nunca innerHTML
            respuestaUI.textContent = 'Conectando con el servidor...';

            try {
                // Simulación de petición asíncrona fetch()
                await new Promise(resolve => setTimeout(resolve, 2000));

                respuestaUI.textContent = '¡Suscripción confirmada con éxito en la base de datos!';
            } catch (error) {
                respuestaUI.textContent = 'No se pudo completar la suscripción. Intente nuevamente.';
            } finally {
                // El botón se vuelve a habilitar haya salido bien o mal
                btnEnviar.disabled = false;
                btnEnviar.textContent = 'Suscribirme';
            }
        });
    </script>
</body>
</html>
