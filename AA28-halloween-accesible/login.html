<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar — Noche de Disfraces</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕯️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Grenze+Gothic:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css?v=28">
</head>
<body class="pagina-acceso">

  <a href="#contenido" class="saltar-contenido">Saltar al contenido principal</a>

  <header class="cabecera">
    <div class="cabecera-interior">
      <a href="index.html" class="logo"><span aria-hidden="true">⚰️</span> Noche de Disfraces</a>
      <nav class="menu" aria-label="Menú principal">
        <a href="index.html" class="menu-enlace">Disfraces</a>
        <div class="menu-usuario" data-menu-usuario></div>
      </nav>
    </div>
  </header>

  <main id="contenido" class="acceso" tabindex="-1">
    <div class="tarjeta-formulario tarjeta-acceso">
      <p class="acceso-icono" aria-hidden="true">🦇</p>
      <h1>Ingresar</h1>
      <p class="ayuda">Entrá con tu usuario para votar tus disfraces favoritos.</p>

      <div class="alerta" id="alerta" role="status" aria-live="polite" aria-atomic="true" hidden></div>

      <form id="form-login" class="formulario" novalidate>
        <div class="campo">
          <label for="nombre">Usuario</label>
          <input type="text" id="nombre" name="nombre" autocomplete="username" required>
        </div>
        <div class="campo">
          <label for="clave">Contraseña</label>
          <input type="password" id="clave" name="clave" autocomplete="current-password" required>
        </div>
        <button type="submit" class="boton boton-principal boton-ancho">Ingresar</button>
      </form>

      <p class="acceso-pie">¿No tenés cuenta? <a href="registro.html">Registrate</a></p>
    </div>
  </main>

  <footer class="pie">
    <p><span aria-hidden="true">🕸️</span> AA28 · Paradigmas y Lenguajes de Programación III · Halloween 2026</p>
  </footer>

  <script src="js/comun.js?v=28"></script>
  <script src="js/acceso.js?v=28"></script>
</body>
</html>
